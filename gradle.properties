# suppress inspection "UnusedProperty" for whole file
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.jvmargs=-Xms256m -Xmx1024m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
group=com.christophsturm.restaurant
version=0.0.12

# Project-specific configuration for shared build-logic
project.name=Restaurant
project.description=Powerful Kotlin HTTP client with clean API
project.url=https://github.com/christophsturm/restaurant
project.repo=christophsturm/restaurant
jvm.production=11
jvm.test=17
use.failgood.asserts=true
use.strict.mode=false

# Pitest configuration
pitest.target.classes=restaurant.*
pitest.target.tests=*Test,**.*Test
pitest.version=1.9.8
