[versions]
kotlin = "2.3.20"
kotlinx-coroutines = "1.10.1"
kotlinx-serialization = "1.8.0"
jackson = "2.19.0"
undertow = "2.3.18.Final"
failgood = "0.9.2"
strikt = "0.34.1"
kotlin-logging = "3.0.5"
logback = "1.5.16"
auth0-jwt = "4.5.0"
pitest = "1.9.8"

[libraries]
# Kotlin
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }

# Coroutines
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-jdk8 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8", version.ref = "kotlinx-coroutines" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Jackson
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# Server
undertow-core = { module = "io.undertow:undertow-core", version.ref = "undertow" }

# JWT
auth0-jwt = { module = "com.auth0:java-jwt", version.ref = "auth0-jwt" }

# Logging
kotlin-logging = { module = "io.github.microutils:kotlin-logging", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Testing
failgood = { module = "dev.failgood:failgood", version.ref = "failgood" }
strikt = { module = "io.strikt:strikt-core", version.ref = "strikt" }

[bundles]
# Common Jackson dependencies
jackson = ["jackson-core", "jackson-databind", "jackson-module-kotlin"]

# Common test dependencies
testing = ["failgood", "kotlin-test", "kotlin-test-junit5"]

[plugins]
# Plugins are managed in settings.gradle.kts and build-logic
